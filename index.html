<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Duck Race</title>
<style>
  :root {
    --bg: #0f2a3f;
    --panel: #163a55;
    --panel-2: #1d4a6a;
    --text: #eaf6ff;
    --muted: #9fc3dc;
    --accent: #ffcb3d;
    --accent-2: #ff8a3d;
    --water-1: #2aa7e0;
    --water-2: #1b86c7;
    --water-3: #176fa9;
    --lane: rgba(255,255,255,0.14);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1f4e73 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100%;
    padding: 16px;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    gap: 16px;
    grid-template-columns: 300px 1fr;
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
  }
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: 28px; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 10px;
  }
  h1 .logo { width: 40px; height: 40px; }
  .sub { color: var(--muted); font-size: 14px; }

  .panel {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 220px; resize: vertical;
    background: var(--panel-2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 10px; font: inherit; font-size: 15px; line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-top: 12px; }
  input[type=number] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 10px; font: inherit; font-size: 15px;
  }
  input[type=number]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--accent); color: #1b1b1b;
    transition: transform .08s ease, filter .15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px) scale(0.99); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid rgba(255,255,255,0.15); }
  button.primary { flex: 1; font-size: 16px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.4; }

  .stage-wrap { display: grid; gap: 12px; }
  .pond {
    position: relative;
    border-radius: var(--radius);
    overflow: hidden;
    background:
      linear-gradient(180deg, var(--water-1), var(--water-2) 55%, var(--water-3));
    min-height: 320px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.18), 0 10px 30px rgba(0,0,0,0.25);
  }
  .pond .waves {
    position: absolute; inset: 0; pointer-events: none; opacity: .35;
    background-image:
      repeating-linear-gradient(180deg, transparent 0 22px, rgba(255,255,255,.18) 22px 23px);
    mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    animation: drift 6s linear infinite;
  }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 0 23px; } }
  .finish {
    position: absolute; top: 0; bottom: 0; right: 56px; width: 14px;
    background:
      repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 14px 14px;
    opacity: .9;
  }
  .finish-flag {
    position: absolute; top: 8px; right: 14px; font-size: 26px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.3));
  }
  .lanes { position: absolute; inset: 0; z-index: 2; }
  .lane {
    position: absolute; left: 0; right: 0;
    border-bottom: 1px dashed var(--lane);
  }
  .duck {
    position: absolute; left: 0;
    width: 64px; height: 64px;
    transform: translate3d(0,0,0);
    will-change: transform;
  }
  .duck .body { width: 100%; height: 100%; animation: bob 1.1s ease-in-out infinite; transform-origin: 50% 80%; }
  .duck.swimming .body { animation-duration: var(--bob, 1s); }
  @keyframes bob {
    0%   { transform: translateY(0) rotate(-3deg); }
    50%  { transform: translateY(-4px) rotate(3deg); }
    100% { transform: translateY(0) rotate(-3deg); }
  }
  .duck .tag {
    position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
    white-space: nowrap; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.92); color: #15324a;
    padding: 2px 8px; border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    max-width: 160px; overflow: hidden; text-overflow: ellipsis;
  }
  .duck .ripple {
    position: absolute; left: 4px; right: 4px; bottom: 6px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
    opacity: 0; transition: opacity .3s;
  }
  .duck.swimming .ripple { opacity: 1; animation: ripple var(--bob, 1s) ease-in-out infinite; }
  @keyframes ripple {
    0%,100% { transform: scaleX(1); opacity: .8; }
    50% { transform: scaleX(1.25); opacity: .4; }
  }
  .duck .wake {
    position: absolute; right: 100%; top: 70%; width: 70px; height: 6px;
    background: linear-gradient(270deg, rgba(255,255,255,.7), rgba(255,255,255,0));
    border-radius: 999px; opacity: 0; transform: scaleY(.6);
  }
  .duck.swimming .wake { opacity: 1; }
  .duck.winner .tag { background: var(--accent); }

  .countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 96px; font-weight: 900; color: #fff;
    text-shadow: 0 6px 20px rgba(0,0,0,.4);
    pointer-events: none; opacity: 0;
  }
  .countdown.show { animation: pop .9s ease-out; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.4); }
    20% { opacity: 1; transform: scale(1.1); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  .results { display: grid; gap: 8px; }
  .results h2 { margin: 0 0 4px; font-size: 18px; }
  .result-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .result-list li {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border-radius: 10px; padding: 8px 10px;
    animation: slidein .35s ease both;
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  .result-list .place { width: 28px; text-align: center; font-weight: 800; }
  .result-list .mini { width: 32px; height: 32px; }
  .result-list li.first { background: linear-gradient(90deg, #6b4e00, var(--panel-2)); outline: 2px solid var(--accent); }
  .empty { color: var(--muted); font-size: 14px; }

  .banner {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
    background: rgba(15,42,63,.92); border: 2px solid var(--accent);
    border-radius: 16px; padding: 18px 26px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
    backdrop-filter: blur(4px);
  }
  .banner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .banner .trophy { font-size: 40px; }
  .banner .name { font-size: 26px; font-weight: 900; color: var(--accent); }
  .banner small { color: var(--muted); }

  .confetti { position: absolute; top: -10px; width: 8px; height: 12px; opacity: .9; animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translateY(420px) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#duck-shape"/></svg>
      Duck Race
    </h1>
    <div class="sub">Add names, hit <b>Race!</b> and may the luckiest duck win.</div>
  </header>

  <aside class="panel">
    <label for="names">Racers (one per line)</label>
    <textarea id="names" spellcheck="false">Andrew
Anthony
Chanakya
Dawn
Semps
Zoe</textarea>
    <div class="field">
      <label for="duration">Race time (seconds)</label>
      <input id="duration" type="number" min="5" max="300" step="1" value="30" />
    </div>
    <div class="controls">
      <button id="race" class="primary">🏁 Race!</button>
      <button id="shuffle" class="secondary" title="Re-roll duck designs">🎲 New ducks</button>
    </div>
    <div class="hint">
      Tip: the race is a fair random draw. Every duck gets a new look and a new burst of
      speed each race, so being out front early means nothing.
    </div>
  </aside>

  <section class="stage-wrap">
    <div class="pond" id="pond">
      <div class="waves"></div>
      <div class="lanes" id="lanes"></div>
      <div class="finish"></div>
      <div class="finish-flag">🏁</div>
      <div class="countdown" id="countdown"></div>
      <div class="banner" id="banner">
        <div class="trophy">🏆</div>
        <div class="name" id="banner-name"></div>
        <small>takes the win!</small>
      </div>
    </div>
    <div class="panel results">
      <h2>Results</h2>
      <ol class="result-list" id="results"></ol>
      <div class="empty" id="results-empty">No race yet. Add some names and start the race.</div>
    </div>
  </section>
</div>

<!-- Shared duck geometry; each duck instance recolours it via CSS variables. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="duck-shape">
      <!-- tail -->
      <path d="M8 38 L18 30 L20 42 Z" fill="var(--duck-body,#ffd23f)"/>
      <!-- body -->
      <ellipse cx="30" cy="42" rx="20" ry="13" fill="var(--duck-body,#ffd23f)"/>
      <!-- wing -->
      <ellipse cx="30" cy="44" rx="11" ry="6" fill="var(--duck-wing,#f2b30c)" transform="rotate(-10 30 44)"/>
      <!-- head -->
      <circle cx="44" cy="26" r="11" fill="var(--duck-body,#ffd23f)"/>
      <!-- bill -->
      <path d="M53 26 L63 29 L53 32 Z" fill="var(--duck-bill,#ff8a3d)"/>
      <!-- eye -->
      <circle cx="47" cy="23" r="2.2" fill="#1b1b1b"/>
      <circle cx="47.8" cy="22.3" r=".7" fill="#fff"/>
      <!-- cheek -->
      <circle cx="43" cy="29" r="2" fill="var(--duck-cheek,rgba(255,120,120,.5))"/>
    </g>
  </defs>
</svg>

<script>
(() => {
  'use strict';

  // ---------- Utilities ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const pick = (arr) => arr[randInt(0, arr.length - 1)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const $ = (sel) => document.querySelector(sel);
  const pond = $('#pond');
  const lanesEl = $('#lanes');
  const namesEl = $('#names');
  const durationEl = $('#duration');
  const raceBtn = $('#race');
  const shuffleBtn = $('#shuffle');
  const countdownEl = $('#countdown');
  const bannerEl = $('#banner');
  const bannerName = $('#banner-name');
  const resultsEl = $('#results');
  const resultsEmpty = $('#results-empty');

  // ---------- Duck designs ----------
  const PALETTES = [
    { body: '#ffd23f', wing: '#f2b30c', bill: '#ff8a3d' },   // classic
    { body: '#ffffff', wing: '#e6e6e6', bill: '#ffb347' },   // snowy
    { body: '#7bd3f7', wing: '#4db3e6', bill: '#ff7f50' },   // sky
    { body: '#ff8fab', wing: '#ff5c8a', bill: '#ffd166' },   // pink
    { body: '#a8e05f', wing: '#7cc242', bill: '#ff9f1c' },   // lime
    { body: '#c9a7ff', wing: '#a77dff', bill: '#ffb703' },   // lavender
    { body: '#ffb347', wing: '#ff8c1a', bill: '#d62828' },   // tangerine
    { body: '#4ecdc4', wing: '#2bb3a9', bill: '#ffd166' },   // teal
    { body: '#f4f1de', wing: '#e0d9c0', bill: '#e07a5f' },   // cream
    { body: '#2b2d42', wing: '#1a1b2e', bill: '#ffd23f' },   // midnight
    { body: '#ff6b6b', wing: '#ee5253', bill: '#feca57' },   // cherry
    { body: '#b8f2e6', wing: '#8ad9cc', bill: '#ff9f1c' },   // mint
  ];
  const CHEEKS = ['rgba(255,120,120,.55)', 'rgba(255,170,200,.6)', 'rgba(255,200,80,.5)', 'transparent'];

  // Accessories are drawn on top of the shared shape.
  const HATS = [
    () => '',
    () => `<rect x="36" y="9" width="16" height="6" rx="1" fill="#222"/><rect x="39" y="2" width="10" height="9" rx="1" fill="#222"/>`, // top hat
    () => `<path d="M34 16 Q44 4 54 16 Z" fill="${pick(['#e63946','#1d3557','#2a9d8f','#f4a261'])}"/><circle cx="44" cy="7" r="2" fill="#fff"/>`, // party hat
    () => `<path d="M33 15 Q44 6 55 15 L57 17 L31 17 Z" fill="${pick(['#d62828','#003049','#6a994e'])}"/><rect x="33" y="15" width="22" height="3" fill="#fff" opacity=".7"/>`, // cap
    () => `<path d="M35 15 L38 8 L41 14 L44 7 L47 14 L50 8 L53 15 Z" fill="#ffd23f" stroke="#c89b00" stroke-width="1"/>`, // crown
    () => `<path d="M34 16 Q44 10 54 16 Q44 18 34 16 Z" fill="#3a86ff"/><path d="M36 15 L30 9" stroke="#3a86ff" stroke-width="3" stroke-linecap="round"/>`, // beret-ish
    () => `<ellipse cx="44" cy="15" rx="14" ry="3" fill="#8d6e63"/><path d="M36 15 Q44 4 52 15 Z" fill="#a1887f"/>`, // sun hat
  ];
  const EYEWEAR = [
    () => '',
    () => `<rect x="42" y="20" width="9" height="6" rx="2" fill="#111" opacity=".85"/><rect x="52" y="20" width="4" height="6" rx="1.5" fill="#111" opacity=".85"/>`, // shades
    () => `<circle cx="47" cy="23" r="4" fill="none" stroke="#333" stroke-width="1.5"/><circle cx="56" cy="23" r="3" fill="none" stroke="#333" stroke-width="1.5"/><path d="M51 23 L53 23" stroke="#333" stroke-width="1.5"/>`, // glasses
    () => `<path d="M40 22 Q47 18 54 22" stroke="#222" stroke-width="1.6" fill="none"/>`, // angry brow
  ];
  const NECK = [
    () => '',
    () => `<path d="M36 32 Q44 38 52 32" stroke="${pick(['#e63946','#2a9d8f','#8338ec'])}" stroke-width="3" fill="none" stroke-linecap="round"/>`, // scarf
    () => `<path d="M42 34 L46 36 L42 40 Z M50 34 L46 36 L50 40 Z" fill="#111"/>`, // bow tie
    () => `<circle cx="38" cy="36" r="1.6" fill="#ffd23f"/><circle cx="42" cy="38" r="1.6" fill="#ffd23f"/><circle cx="46" cy="38.5" r="1.6" fill="#ffd23f"/>`, // necklace
  ];
  const WING_PATTERN = [
    () => '',
    () => `<g fill="rgba(255,255,255,.55)"><circle cx="26" cy="43" r="1.6"/><circle cx="32" cy="46" r="1.6"/><circle cx="34" cy="41" r="1.6"/></g>`, // spots
    () => `<path d="M22 44 Q30 38 38 44" stroke="rgba(0,0,0,.25)" stroke-width="1.5" fill="none"/>`, // stripe
  ];

  function randomDesign() {
    const palette = pick(PALETTES);
    return {
      body: palette.body, wing: palette.wing, bill: palette.bill,
      cheek: pick(CHEEKS),
      hat: pick(HATS)(),
      eyewear: pick(EYEWEAR)(),
      neck: pick(NECK)(),
      pattern: pick(WING_PATTERN)(),
      scale: rand(0.9, 1.1),
    };
  }

  function duckSVG(design) {
    return `<svg viewBox="0 0 64 64" style="--duck-body:${design.body};--duck-wing:${design.wing};--duck-bill:${design.bill};--duck-cheek:${design.cheek}">
      <g transform="translate(32 40) scale(${design.scale}) translate(-32 -40)">
        <use href="#duck-shape"/>${design.pattern}${design.neck}${design.eyewear}${design.hat}
      </g>
    </svg>`;
  }

  // ---------- State ----------
  let ducks = [];     // { name, el, design, x, speed, phase, finished, place }
  let racing = false;
  let rafId = 0;

  function readDuration() {
    const v = clamp(parseFloat(durationEl.value) || 30, 5, 300);
    durationEl.value = v;
    return v;
  }

  function readNames() {
    return namesEl.value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 30);
  }

  function layout() {
    const names = readNames();
    lanesEl.innerHTML = '';
    ducks = [];
    const n = names.length;
    const laneH = clamp(Math.floor(520 / Math.max(n, 1)), 44, 90);
    const duckSize = clamp(laneH - 12, 36, 64);
    pond.style.height = Math.max(320, n * laneH + 24) + 'px';

    names.forEach((name, i) => {
      const lane = document.createElement('div');
      lane.className = 'lane';
      lane.style.top = (12 + (i + 1) * laneH) + 'px';
      lanesEl.appendChild(lane);

      const design = randomDesign();
      const el = document.createElement('div');
      el.className = 'duck';
      el.style.width = el.style.height = duckSize + 'px';
      el.style.top = (12 + i * laneH + (laneH - duckSize) / 2) + 'px';
      el.style.setProperty('--bob', rand(0.8, 1.3).toFixed(2) + 's');
      el.innerHTML = `<div class="wake"></div><div class="ripple"></div><div class="body">${duckSVG(design)}</div><div class="tag">${escapeHtml(name)}</div>`;
      lanesEl.appendChild(el);

      ducks.push({ name, el, design, x: 0, finished: false, place: 0 });
    });

    raceBtn.disabled = n < 2;
    return n;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function trackLength() {
    const duckW = ducks[0] ? ducks[0].el.offsetWidth : 64;
    // Finish line sits 56px from the right edge; duck's bill should cross it.
    return pond.clientWidth - 56 - duckW + 10;
  }

  // ---------- Race ----------
  function showCountdown(text) {
    return new Promise(res => {
      countdownEl.textContent = text;
      countdownEl.classList.remove('show');
      void countdownEl.offsetWidth; // restart animation
      countdownEl.classList.add('show');
      setTimeout(res, 800);
    });
  }

  async function startRace() {
    if (racing) return;
    const n = layout();
    if (n < 2) return;
    racing = true;
    raceBtn.disabled = true;
    shuffleBtn.disabled = true;
    namesEl.disabled = true;
    durationEl.disabled = true;
    bannerEl.classList.remove('show');
    resultsEl.innerHTML = '';
    resultsEmpty.style.display = 'none';
    clearConfetti();

    await showCountdown('3');
    await showCountdown('2');
    await showCountdown('1');
    await showCountdown('GO!');

    // Pick the winner up-front, then simulate speeds that wobble a lot but
    // nudge things so the chosen winner edges it at the line.
    const winnerIdx = randInt(0, n - 1);
    const L = trackLength();
    const duration = readDuration() * 1000;
    const start = performance.now();

    ducks.forEach((d, i) => {
      d.el.classList.add('swimming');
      d.el.classList.remove('winner');
      d.x = 0;
      d.finished = false;
      d.place = 0;
      d.base = L / duration;                        // px per ms needed to finish exactly on time
      d.mult = rand(0.9, 1.02);                      // tight pace band so the pack stays bunched and trades the lead
      d.phases = [rand(0, 6.28), rand(0, 6.28), rand(0, 6.28)];
      const secs = duration / 1000;                 // keep swaps/bursts ~as frequent per second regardless of race length
      const tf = secs / 8;
      d.freqs = [rand(0.6, 1.2) * tf, rand(1.6, 2.8) * tf, rand(3.5, 6) * tf];
      d.amps = [rand(0.55, 0.8), rand(0.2, 0.35), rand(0.08, 0.15)];
      d.bursts = [rand(0.1, 0.9), rand(0.1, 0.9), rand(0.1, 0.9)]; // several random speed bursts across the race
      d.isWinner = i === winnerIdx;
    });

    let placeCounter = 0;
    let lastT = start;

    function frame(now) {
      const dt = Math.min(40, now - lastT);
      lastT = now;
      const t = (now - start) / duration;            // 0..1 nominal progress

      let maxX = 0;
      for (const d of ducks) {
        if (d.finished) continue;
        // Layered sine noise gives bursts and slumps.
        let s = 1;
        for (let k = 0; k < 3; k++) s += d.amps[k] * Math.sin(t * d.freqs[k] * Math.PI * 2 + d.phases[k]);
        // Random bursts (each ~0.4s wide in real time)
        for (const b of d.bursts) s += Math.exp(-Math.pow((t - b) / (0.4 / (duration / 1000)), 2)) * 0.9;

        // Rubber-banding so the pack stays close, then let the winner surge late.
        const progress = d.x / L;
        const leaderGap = progress - (maxX / L);
        if (d.isWinner) {
          const late = clamp((t - 0.7) / 0.3, 0, 1);  // ramps 0->1 over the final 30%
          s += late * late * 1.6;                     // decisive late surge
        } else {
          // Non-winners slow slightly when very close to the line so the
          // winner's surge can convert, but never stop outright.
          if (progress > 0.9) s *= 0.78;
        }
        s *= d.mult;
        d.x += d.base * s * dt;
        if (d.x > maxX) maxX = d.x;
      }

      // Hard guarantee: nobody but the winner may cross first.
      const winner = ducks[winnerIdx];
      for (const d of ducks) {
        if (!d.isWinner && !winner.finished && d.x >= L - 2) d.x = L - 2 - rand(0, 4);
      }

      for (const d of ducks) {
        if (!d.finished && d.x >= L) {
          d.x = L;
          d.finished = true;
          d.place = ++placeCounter;
          d.el.classList.remove('swimming');
          if (d.isWinner) {
            d.el.classList.add('winner');
            celebrate(d);
          }
          addResult(d);
        }
        d.el.style.transform = `translate3d(${d.x}px,0,0)`;
      }

      // After the winner finishes, let everyone else drift home quickly.
      if (winner.finished) {
        for (const d of ducks) if (!d.finished) d.x += d.base * 2.2 * dt;
      }

      if (ducks.some(d => !d.finished)) {
        rafId = requestAnimationFrame(frame);
      } else {
        racing = false;
        raceBtn.disabled = false;
        shuffleBtn.disabled = false;
        namesEl.disabled = false;
        durationEl.disabled = false;
        raceBtn.textContent = '🔁 Race again';
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function addResult(d) {
    const li = document.createElement('li');
    if (d.place === 1) li.classList.add('first');
    const medal = ['🥇', '🥈', '🥉'][d.place - 1] || `${d.place}.`;
    li.innerHTML = `<span class="place">${medal}</span><span class="mini">${duckSVG(d.design)}</span><span>${escapeHtml(d.name)}</span>`;
    resultsEl.appendChild(li);
  }

  function celebrate(d) {
    bannerName.textContent = d.name;
    bannerEl.classList.add('show');
    const colors = ['#ffcb3d', '#ff8a3d', '#ff6b6b', '#4ecdc4', '#c9a7ff', '#fff'];
    const w = pond.clientWidth;
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = rand(0, w) + 'px';
      c.style.background = pick(colors);
      c.style.animationDuration = rand(1.6, 3.2) + 's';
      c.style.animationDelay = rand(0, 0.8) + 's';
      c.style.transform = `rotate(${rand(0, 360)}deg)`;
      pond.appendChild(c);
    }
    setTimeout(clearConfetti, 4500);
  }
  function clearConfetti() { pond.querySelectorAll('.confetti').forEach(c => c.remove()); }

  // ---------- Wiring ----------
  raceBtn.addEventListener('click', startRace);
  shuffleBtn.addEventListener('click', () => { if (!racing) layout(); });
  namesEl.addEventListener('input', () => { if (!racing) layout(); });
  window.addEventListener('resize', () => {
    if (racing) return;
    layout();
  });

  layout();
})();
</script>
</body>
</html>
